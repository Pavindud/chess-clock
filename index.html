<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Clock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="setup" id="setupPanel">
  <div class="setup-box">
    <h1>Chess Clock</h1>
    <label>
      Minutes per side
      <input type="number" id="minutesInput" value="10" min="1">
    </label>
    <label>
      Increment (seconds)
      <input type="number" id="incrementInput" value="5" min="0">
    </label>
    
    <div class="setup-buttons">
      <button id="applyBtn">Apply</button>
    </div>
  </div>
</div>

<div class="main-layout">
  <div class="clock-container">
    <button id="whiteClock" class="player-clock white">10:00</button>
    <button id="blackClock" class="player-clock black">10:00</button>
  </div>

  <div class="controls">
    <button id="pauseBtn" class="control-btn" title="Pause" aria-label="Pause">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <button id="resetBtn" class="control-btn" title="Reset" aria-label="Reset">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
      </svg>
    </button>
    <button id="re-load" class="control-btn" title="Reload" aria-label="Reload">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </button>
  </div>
</div>

<p id="statusMsg"></p>

<script src="clock.js"></script>
<script src="app.js"></script>
</body>
</html>
